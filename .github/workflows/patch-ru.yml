name: Patch ru strings
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-ru-strings.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-ru-strings.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/i18n/locales/ru.json
          git diff --cached --quiet || git commit -m 'i18n(ru): fix tryGenre + fa name'
          git push origin HEAD:main
